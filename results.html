<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hasil Carian Pakej | UmrahKasih</title><link rel="stylesheet" href="product.css"></head><body>
<header class="top"><a href="index.html"><img src="logo-primary.png" alt="UmrahKasih"></a><a href="index.html#finder">Ubah Carian</a></header>
<main class="wrap"><section class="results-head"><div class="eyebrow">PILIHAN MENUJU BAITULLAH</div><h1>Pakej Yang Sesuai</h1><p id="count"></p><p class="series-note">Visual menunjukkan siri pakej. Harga, tarikh, hotel dan penerbangan dibaca daripada data produk sebenar.</p></section><section id="grid" class="grid"></section></main>
<script src="product-data.js"></script><script>
const q=new URLSearchParams(location.search),series=q.get('series');let items=UMRAH_PRODUCTS.filter(p=>!series||p.series===series);const grid=document.getElementById('grid');document.getElementById('count').textContent=items.length+' pakej ditemui';
if(!items.length){grid.innerHTML='<div class="empty">Maklumat produk untuk siri ini belum dimasukkan. Visual siri sudah tersedia dan data produk akan dipaparkan secara automatik apabila ditambah.</div>'}else items.forEach(p=>{const v=UMRAH_VISUALS[p.series],a=document.createElement('a');a.className='card';a.href='product.html?id='+encodeURIComponent(p.id);a.innerHTML=`<img src="${v.square}" alt="${v.label}"><div class="card-body"><div class="eyebrow">${p.season} · ${p.duration}</div><h2>${p.name}</h2><div class="from">Bermula <b>RM${p.from.toLocaleString()}</b></div><div class="info">Hotel Makkah: ${p.hotels[0][1]}<br>Hotel Madinah: ${p.hotels[1][1]}<br>Penerbangan: ${p.flight.split('·')[1]||p.flight}<br>${p.dates.join(' · ')}</div><span class="more">Maklumat Penuh ›</span></div>`;grid.appendChild(a)});
</script></body></html>
