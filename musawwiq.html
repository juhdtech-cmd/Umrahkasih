<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar Musawwiq | UmrahKasih</title><link rel="stylesheet" href="style.css"></head><body style="background:#fbf7ed;margin:0">
<header style="padding:18px 20px;background:#fff;border-bottom:1px solid #eee4d5"><a href="index.html"><img src="logo-primary.png" alt="UmrahKasih" style="height:44px;width:auto"></a></header>
<main><section class="v55-enquiry" style="padding-top:52px"><div class="v55-inner"><div class="v55-kicker">MUSAWWIQ UMRAHKASIH</div><h2>Bantu Mereka Menuju Baitullah.<br>Jana Pendapatan Bersama Kami.</h2><p class="v55-lead">Daftarkan minat anda untuk menjadi Musawwiq UmrahKasih. Maklumat lanjut mengenai program dan akses sistem akan diberikan selepas pendaftaran disemak.</p>

</div></section></main><script>document.getElementById('musawwiqForm').addEventListener('submit',function(e){e.preventDefault();document.getElementById('musawwiqStatus').textContent='Borang pendaftaran sudah siap. Sambungan penghantaran/database akan diaktifkan pada fasa sistem Musawwiq.'})</script></body></html>
