<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maklumat Pakej | UmrahKasih</title><link rel="stylesheet" href="product.css"></head><body>
<header class="top"><a href="index.html"><img src="logo-primary.png" alt="UmrahKasih"></a><a href="results.html">‹ Pakej</a></header>
<main class="wrap" id="app"></main><div class="cta"><div class="inner"><div><small id="chosen">Pilih tarikh & bilik</small><strong id="chosenPrice"></strong></div><a id="interest" href="#">Saya Berminat ›</a></div></div>
<script src="product-data.js"></script><script>
const params=new URLSearchParams(location.search);
const id=params.get('id')||'eko-normal-9h7m-2026-27';
const p=UMRAH_PRODUCTS.find(x=>x.id===id),app=document.getElementById('app');
if(!p){app.innerHTML='<p>Pakej tidak ditemui.</p>';throw new Error('not found')}
const v=UMRAH_VISUALS[p.series];let date='',room='',price='';
const departures=Array.isArray(p.departures)?p.departures:(p.dates||[]).map(label=>({label}));
const description=p.description?`<p class="desc">${p.description}</p>`:'';
app.innerHTML=`<section class="hero"><img src="${v.banner}" alt="${v.label}"></section><section class="summary"><div class="eyebrow">${p.season} · ${p.duration}</div><h1>${p.name}</h1><div class="price">Bermula <b>RM${p.from.toLocaleString()}</b></div>${description}</section><section class="section"><h2>Pilih Tarikh Penerbangan</h2><div class="chips" id="dates">${departures.map(x=>`<button class="chip">${x.label}</button>`).join('')}</div></section><section class="section"><h2>Pilihan Bilik & Harga</h2><div class="rooms" id="rooms">${p.rooms.map(x=>`<button class="room" data-price="${x[1]}">${x[0]}<strong>RM${x[1].toLocaleString()}</strong></button>`).join('')}</div></section><section class="section"><h2>Maklumat Penginapan</h2><div class="hotels">${p.hotels.map(x=>`<div class="hotel"><div class="eyebrow">${x[0]}</div><h3>${x[1]}</h3><small>${x[2]}</small></div>`).join('')}</div></section><section class="section"><h2>Penerbangan</h2><div class="flight">${p.flight}</div></section><section class="section acc"><details><summary>Maklumat Kanak-kanak & Bayi +</summary><ul>${p.children.map(x=>`<li>${x}</li>`).join('')}</ul></details><details><summary>Pakej Termasuk / Tidak Termasuk +</summary><h3>Pakej Termasuk</h3><ul>${p.included.map(x=>`<li>${x}</li>`).join('')}</ul><h3>Tidak Termasuk</h3><ul>${p.excluded.map(x=>`<li>${x}</li>`).join('')}</ul></details><details><summary>Cara Daftar +</summary><ol>${p.registration.map(x=>`<li>${x}</li>`).join('')}</ol></details></section>`;
function sync(){
  document.getElementById('chosen').textContent=(date||'Pilih tarikh')+' · '+(room||'Pilih bilik');
  document.getElementById('chosenPrice').textContent=price?'RM'+Number(price).toLocaleString():'';
  const msg=`Assalamualaikum, saya berminat dengan ${p.name} (${p.season})${date?' · '+date:''}${room?' · '+room:''}${price?' · RM'+Number(price).toLocaleString():''}.`;
  document.getElementById('interest').href='https://wa.me/60135890865?text='+encodeURIComponent(msg);
}
document.querySelectorAll('#dates .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#dates .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');date=b.textContent;sync()});
document.querySelectorAll('#rooms .room').forEach(b=>b.onclick=()=>{document.querySelectorAll('#rooms .room').forEach(x=>x.classList.remove('active'));b.classList.add('active');room=b.childNodes[0].textContent.trim();price=b.dataset.price;sync()});
sync();
</script></body></html>
