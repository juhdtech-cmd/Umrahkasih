<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maklumat Pakej | UmrahKasih</title><link rel="stylesheet" href="product.css"><link rel="stylesheet" href="customer-enquiry.css?v=54.44"></head><body>
<header class="top"><a href="index.html"><img src="logo-primary.png" alt="UmrahKasih"></a><a href="results.html">‹ Pakej</a></header>
<main class="wrap" id="app"></main><div class="cta"><div class="inner"><div><small id="chosen">Pilih tarikh & bilik</small><strong id="chosenPrice"></strong></div><a id="interest" href="#">Saya Berminat ›</a></div></div>

<section class="uk-enquiry-modal" id="ukEnquiryModal" hidden aria-hidden="true" aria-labelledby="ukEnquiryTitle">
  <div class="uk-enquiry-backdrop" data-enquiry-close></div>
  <div class="uk-enquiry-card" role="dialog" aria-modal="true">
    <button class="uk-enquiry-close" type="button" data-enquiry-close aria-label="Tutup">×</button>
    <div id="ukEnquiryFormView">
      <span class="uk-enquiry-kicker">PERTANYAAN PAKEJ</span>
      <h2 id="ukEnquiryTitle">Saya Berminat</h2>
      <p class="uk-enquiry-intro">Tinggalkan nama dan nombor telefon. Pasukan jualan UmrahKasih akan menghubungi anda.</p>
      <div class="uk-enquiry-package" id="ukEnquiryPackage"></div>
      <form id="ukEnquiryForm">
        <label>Nama<input id="ukCustomerName" name="name" autocomplete="name" required maxlength="80" placeholder="Nama penuh"></label>
        <label>No. Telefon / WhatsApp<input id="ukCustomerPhone" name="phone" autocomplete="tel" inputmode="tel" required maxlength="24" placeholder="Contoh: 0123456789"></label>
        <div class="uk-enquiry-error" id="ukEnquiryError" hidden></div>
        <button class="uk-enquiry-submit" id="ukEnquirySubmit" type="submit">Hantar Pertanyaan ›</button>
      </form>
      <small class="uk-enquiry-ref" id="ukEnquiryRef"></small>
    </div>
    <div class="uk-enquiry-success" id="ukEnquirySuccess" hidden>
      <span class="uk-enquiry-kicker">PERTANYAAN DITERIMA</span>
      <h2>Terima kasih.</h2>
      <p>Pasukan jualan UmrahKasih akan menghubungi anda melalui nombor yang diberikan.</p>
      <button type="button" data-enquiry-close>Tutup</button>
    </div>
  </div>
</section>
<script src="product-data.js"></script><script src="referral.js?v=54.44"></script><script>
const params=new URLSearchParams(location.search);
const id=params.get('id')||'eko-normal-9h7m-2026-27';
const p=UMRAH_PRODUCTS.find(x=>x.id===id),app=document.getElementById('app');
if(!p){app.innerHTML='<p>Pakej tidak ditemui.</p>';throw new Error('not found')}
const v=UMRAH_VISUALS[p.series];let date='',room='',price='';
const departures=Array.isArray(p.departures)?p.departures:(p.dates||[]).map(label=>({label}));
const description=p.description?`<p class="desc">${p.description}</p>`:'';
function renderList(items){
  return (items||[]).map(x=>{
    if(typeof x==='string') return `<li>${x}</li>`;
    const subs=(x.subitems||[]).length?`<ul class="sublist">${x.subitems.map(y=>`<li>${y}</li>`).join('')}</ul>`:'';
    return `<li>${x.text||''}${subs}</li>`;
  }).join('');
}
const experiences=(p.experiences&&p.experiences.length)?`<section class="section"><h2>Pengalaman Istimewa</h2><div class="experiences">${p.experiences.map(x=>`<article class="experience"><h3>${x.title}</h3><p>${x.text}</p></article>`).join('')}</div>${p.bonus?`<div class="bonus"><div class="eyebrow">BONUS</div><strong>${p.bonus}</strong></div>`:''}</section>`:'';
const closing=p.closingTagline?`<section class="product-closing"><div class="eyebrow">${p.name}</div><h2>${p.closingTagline}</h2>${p.closingText?`<p>${p.closingText}</p>`:''}</section>`:'';
const flightContent=(p.flightDetails&&p.flightDetails.length)?`<div class="flight-options">${p.flightDetails.map(f=>`<article class="flight-option"><img src="${f.logo}" alt="${f.name}"><div><strong>${f.name}</strong>${f.class?`<span>${f.class}</span>`:''}${f.baggage?`<small>${f.baggage}</small>`:''}</div></article>`).join('')}</div>${p.flightNote?`<div class="flight" style="margin-top:10px">${p.flightNote}</div>`:''}`:`<div class="flight">${p.flight}</div>`;
app.innerHTML=`<section class="hero"><img src="${v.banner}" alt="${v.label}"></section><section class="summary"><div class="eyebrow">${p.season} · ${p.duration}</div><h1>${p.name}</h1><div class="price">Bermula <b>RM${p.from.toLocaleString()}</b></div>${description}</section><section class="section"><h2>Pilih Tarikh Penerbangan</h2><div class="chips" id="dates">${departures.map(x=>`<button class="chip">${x.label}</button>`).join('')}</div></section><section class="section"><h2>Pilihan Bilik & Harga</h2><div class="rooms" id="rooms">${p.rooms.map(x=>`<button class="room" data-price="${x[1]}">${x[0]}<strong>RM${x[1].toLocaleString()}</strong><small>/ seorang</small></button>`).join('')}</div></section>${experiences}<section class="section"><h2>Maklumat Penginapan</h2><div class="hotels">${p.hotels.map(x=>`<div class="hotel"><div class="eyebrow">${x[0]}</div><h3>${x[1]}</h3><small>${x[2]}</small></div>`).join('')}</div></section><section class="section"><h2>Maklumat Penerbangan</h2>${flightContent}</section><section class="section acc"><details><summary>Maklumat Kanak-kanak & Bayi +</summary><ul>${renderList(p.children)}</ul></details><details><summary>Pakej Termasuk / Tidak Termasuk +</summary><h3>Pakej Termasuk</h3><ol>${renderList(p.included)}</ol><h3>Tidak Termasuk</h3><ol>${renderList(p.excluded)}</ol></details><details><summary>Cara Daftar +</summary><ol>${renderList(p.registration)}</ol></details></section>${closing}`;
function sync(){
  document.getElementById('chosen').textContent=(date||'Pilih tarikh')+' · '+(room||'Pilih bilik');
  document.getElementById('chosenPrice').textContent=price?'RM'+Number(price).toLocaleString():'';
  const msg=`Assalamualaikum, saya berminat dengan ${p.name} (${p.season})${date?' · '+date:''}${room?' · '+room:''}${price?' · RM'+Number(price).toLocaleString():''}.`;
  document.getElementById('interest').href='https://wa.me/60135890865?text='+encodeURIComponent(msg);
  window.UmrahProductState=()=>({packageId:p.id,packageName:p.name,season:p.season,duration:p.duration,departure:date,room,price:Number(price||0)});
}
document.querySelectorAll('#dates .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#dates .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');date=b.textContent;sync()});
document.querySelectorAll('#rooms .room').forEach(b=>b.onclick=()=>{document.querySelectorAll('#rooms .room').forEach(x=>x.classList.remove('active'));b.classList.add('active');room=b.childNodes[0].textContent.trim();price=b.dataset.price;sync()});
sync();
</script><script type="module" src="customer-enquiry.js?v=54.44"></script></body></html>
